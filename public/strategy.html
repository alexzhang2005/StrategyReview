<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>选股策略 — StrategyReview</title>
<link rel="stylesheet" href="/assets/css/main.css">
<style>
/* ── 策略卡片 ── */
.strategy-cards {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 20px;
}
@media(max-width:900px){ .strategy-cards { grid-template-columns: repeat(2,1fr); } }
.s-card {
  background: var(--bg2);
  border: 2px solid var(--border);
  border-radius: 14px;
  padding: 14px 16px;
  cursor: pointer;
  transition: all .2s;
  text-align: center;
  position: relative;
}
.s-card::after {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  border-radius: 14px 14px 0 0;
  background: var(--c);
  opacity: .5;
}
.s-card:hover { border-color: var(--c); transform: translateY(-2px); }
.s-card.active { border-color: var(--c); background: var(--bg3); }
.s-card.active::after { opacity: 1; }
.s-card .s-icon { font-size: 22px; margin-bottom: 4px; }
.s-card .s-name { font-size: 12px; font-weight: 700; color: var(--text); }
.s-card .s-count { font-size: 11px; color: var(--sub); margin-top: 3px; }
/* ── 多选筛选栏 ── */
.multi-filter {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 16px;
  padding: 12px 16px;
  background: var(--bg2);
  border-radius: 10px;
  border: 1px solid var(--border);
}
.multi-filter label { font-size: 12px; color: var(--sub); white-space: nowrap; }
.multi-check { display: flex; align-items: center; gap: 5px; cursor: pointer; }
.multi-check input[type=checkbox] { accent-color: var(--gold); width: 14px; height: 14px; cursor: pointer; }
.multi-check span { font-size: 12px; font-weight: 600; }
.multi-filter .spacer { flex: 1; }
/* ── 工具栏 ── */
.tool-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.tool-bar .sort-label { font-size: 12px; color: var(--sub); }
/* ── 板块+表格布局（始终显示） ── */
.sector-layout {
  display: flex;
  gap: 16px;
  min-height: 400px;
}
.sector-sidebar {
  width: 180px;
  flex-shrink: 0;
  background: var(--bg2);
  border-radius: 12px;
  border: 1px solid var(--border);
  padding: 12px 8px;
  overflow-y: auto;
  max-height: 700px;
}
.sector-sidebar h4 {
  font-size: 11px;
  color: var(--sub);
  padding: 0 8px;
  margin-bottom: 8px;
  text-transform: uppercase;
  letter-spacing: .5px;
}
.sector-item {
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 12px;
  cursor: pointer;
  transition: all .15s;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.sector-item:hover { background: var(--bg3); }
.sector-item.active { background: rgba(255,215,0,0.12); color: var(--gold); font-weight: 600; }
.sector-item .s-cnt { font-size: 11px; color: var(--sub); margin-left: 4px; flex-shrink: 0; }
.sector-item > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sector-main { flex: 1; min-width: 0; }
/* ── 表格 ── */
.tbl-wrap {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
table.main-tbl {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  min-width: 600px;
}
table.main-tbl th {
  background: var(--bg2);
  color: var(--sub);
  padding: 8px 10px;
  text-align: right;
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
  cursor: pointer;
  user-select: none;
  border-bottom: 1px solid var(--border);
}
table.main-tbl th.no-sort { cursor: default; }
table.main-tbl th.align-left { text-align: left; }
table.main-tbl th.sorted { color: var(--gold); }
table.main-tbl td {
  padding: 7px 10px;
  text-align: right;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
  vertical-align: middle;
}
table.main-tbl td.align-left { text-align: left; }
table.main-tbl tr:hover td { background: rgba(255,255,255,0.02); }
.td-code { font-family: monospace; font-size: 13px; color: var(--blue); cursor: pointer; }
.td-name { font-weight: 600; cursor: pointer; color: var(--text); max-width: 90px; overflow: hidden; text-overflow: ellipsis; display: inline-block; }
.td-name:hover { color: var(--gold); }
.td-ind { font-size: 11px; color: var(--sub); max-width: 100px; overflow: hidden; text-overflow: ellipsis; }
.td-num { color: var(--text); }
.td-pos { color: var(--red); }
.td-neg { color: var(--green); }
.td-nil { color: var(--sub); }
.pill { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 10px; font-weight: 700; margin: 1px; }
.pill-blue   { background: rgba(77,171,247,0.15); color: var(--blue); }
.pill-green  { background: rgba(81,207,102,0.15); color: var(--green); }
.pill-red    { background: rgba(255,107,107,0.15); color: var(--red); }
.pill-gold   { background: rgba(255,215,0,0.15); color: var(--gold); }
.pill-purple { background: rgba(204,93,232,0.15); color: var(--purple); }
</style>
</head>
<body>
<div id="nav-container"></div>

<div class="container">
  <h1 class="page-title">选股策略</h1>
  <p class="page-sub">基于财报数据筛选的量化策略股池，每季度更新</p>

  <!-- 策略卡片（4个） -->
  <div class="strategy-cards" id="s-cards">
    <div class="s-card" style="--c:#339af0" data-key="s1" onclick="selectCard('s1')">
      <div class="s-icon">📦</div>
      <div class="s-name">S1 持股增长</div>
      <div class="s-count" id="cnt-s1">—</div>
    </div>
    <div class="s-card" style="--c:#51cf66" data-key="s2" onclick="selectCard('s2')">
      <div class="s-icon">💹</div>
      <div class="s-name">S2 盈利质量</div>
      <div class="s-count" id="cnt-s2">—</div>
    </div>
    <div class="s-card" style="--c:#ff6b6b" data-key="s3" onclick="selectCard('s3')">
      <div class="s-icon">🚀</div>
      <div class="s-name">S3 全速前进</div>
      <div class="s-count" id="cnt-s3">—</div>
    </div>
    <div class="s-card" style="--c:#cc5de8" data-key="s4" onclick="selectCard('s4')">
      <div class="s-icon">🏛</div>
      <div class="s-name">S4 机构持股</div>
      <div class="s-count" id="cnt-s4">—</div>
    </div>
  </div>

  <!-- 多选AND筛选 -->
  <div class="multi-filter">
    <label>多选AND筛选：</label>
    <label class="multi-check">
      <input type="checkbox" id="chk-s1" onchange="onMultiFilter()">
      <span style="color:#4dabf7">S1</span>
    </label>
    <label class="multi-check">
      <input type="checkbox" id="chk-s2" onchange="onMultiFilter()">
      <span style="color:#51cf66">S2</span>
    </label>
    <label class="multi-check">
      <input type="checkbox" id="chk-s3" onchange="onMultiFilter()">
      <span style="color:#ff6b6b">S3</span>
    </label>
    <label class="multi-check">
      <input type="checkbox" id="chk-s4" onchange="onMultiFilter()">
      <span style="color:#cc5de8">S4</span>
    </label>
    <div class="spacer"></div>
  </div>

  <!-- 工具栏 -->
  <div class="tool-bar">
    <input class="search-input" style="width:200px" id="search-input"
      placeholder="搜索代码/名称/行业..." oninput="onSearch()">
    <span class="sort-label" id="total-label"></span>
    <div style="margin-left:auto;display:flex;gap:8px">
      <button class="btn btn-outline btn-sm" onclick="exportCsv()">📥 导出CSV</button>
    </div>
  </div>

  <!-- 板块侧边栏 + 股票列表（始终并排） -->
  <div class="sector-layout">
    <div class="sector-sidebar">
      <h4>行业板块</h4>
      <div id="sector-list">
        <div class="sector-item active" onclick="filterSector(null)">
          <span>全部</span><span class="s-cnt" id="sector-total">0</span>
        </div>
      </div>
    </div>
    <div class="sector-main">
      <div class="tbl-wrap">
        <table class="main-tbl" id="main-tbl">
          <thead id="tbl-head"></thead>
          <tbody id="tbl-body">
            <tr><td colspan="20"><div class="loading"><div class="spinner"></div>加载中...</div></td></tr>
          </tbody>
        </table>
      </div>
      <div id="pagination"></div>
    </div>
  </div>
</div>

<script src="/assets/js/api.js"></script>
<script src="/assets/js/components.js"></script>
<script>
document.getElementById('nav-container').innerHTML = renderNav('strategy');
initNavStatus();

// ── 状态 ──
let currentCard = 's1';
let multiMode = false;
let multiSelected = [];
let sortState = { col: null, order: 'asc' };
let currentPage = 1;
const PAGE_SIZE = 50;
let searchTimer;
let allStocks = [];
let filteredStocks = [];
let currentSector = null;

// ── 格式化工具 ──
const W = 10000;

function fmtWan(v) {
  if (v == null) return '<span class="td-nil">—</span>';
  return '<span class="td-num">' + (v/W).toFixed(0) + '</span>';
}
function fmtPct(v) {
  if (v == null) return '<span class="td-nil">—</span>';
  const pct = (v * 100).toFixed(1);
  const cls = v > 0 ? 'td-pos' : v < 0 ? 'td-neg' : 'td-nil';
  return '<span class="' + cls + '">' + (v > 0 ? '+' : '') + pct + '%</span>';
}
function fmtNum(v, decimals) {
  decimals = decimals == null ? 2 : decimals;
  if (v == null) return '<span class="td-nil">—</span>';
  return '<span class="td-num">' + Number(v).toFixed(decimals) + '</span>';
}
// 绝对值(万) + 增速(小字下行)
function fmtWithGrowth(val, growth) {
  if (val == null) return '<span class="td-nil">—</span>';
  var w = (val / W).toFixed(0);
  if (growth == null) return '<span class="td-num">' + w + '万</span>';
  var pct = (growth * 100).toFixed(1);
  var sign = growth >= 0 ? '+' : '';
  var gcls = growth > 0 ? 'td-pos' : growth < 0 ? 'td-neg' : 'td-nil';
  return '<span class="td-num">' + w + '万</span><br><span class="' + gcls + '" style="font-size:11px">' + sign + pct + '%</span>';
}
// 百分比值 + 变化量(小字下行)
function fmtPctWithGrowth(val, growth) {
  if (val == null) return '<span class="td-nil">—</span>';
  var pv = parseFloat(val).toFixed(2);
  if (growth == null) return '<span class="td-num">' + pv + '%</span>';
  var gPct = (growth * 100).toFixed(1);
  var sign = growth >= 0 ? '+' : '';
  var gcls = growth > 0 ? 'td-pos' : growth < 0 ? 'td-neg' : 'td-nil';
  return '<span class="td-num">' + pv + '%</span><br><span class="' + gcls + '" style="font-size:11px">' + sign + gPct + '%</span>';
}
// 连续正增长期数
function calcTrailCount(deltas) {
  var count = 0;
  for (var i = 0; i < deltas.length; i++) {
    if (deltas[i] != null && deltas[i] > 0) count++;
    else break;
  }
  return count;
}

// ── 策略表头配置 ──
const COL_DEFS = {
  s1: [
    { key: 'code',    label: '代码',     align: 'left', sortable: false },
    { key: 'name',    label: '名称',     align: 'left', sortable: false },
    { key: 'industry',label: '行业',     align: 'left', sortable: false },
    { key: '_s_tags', label: '命中',     sortable: false },
    { key: '_trail1', label: '增长期数', sortable: false },
    { key: '_26q1_g', label: '26Q1增速', sortable: true, sortKey: 'top10_26q1' },
    { key: '_25q4_g', label: '25Q4',     sortable: true, sortKey: 'top10_25q4' },
    { key: '_25q3_g', label: '25Q3',     sortable: true, sortKey: 'top10_25q3' },
    { key: '_25q2_g', label: '25Q2',     sortable: true, sortKey: 'top10_25q2' },
  ],
  s2: [
    { key: 'code',    label: '代码',     align: 'left', sortable: false },
    { key: 'name',    label: '名称',     align: 'left', sortable: false },
    { key: 'industry',label: '行业',     align: 'left', sortable: false },
    { key: '_s_tags', label: '命中',     sortable: false },
    { key: '_roe25_g',   label: 'ROE25增速',  sortable: true, sortKey: 'roe_25' },
    { key: '_roe24_g',   label: 'ROE24',       sortable: true, sortKey: 'roe_24' },
    { key: '_roe23_g',   label: 'ROE23',       sortable: true, sortKey: 'roe_23' },
    { key: 'roe_22',     label: 'ROE22',       sortable: true },
    { key: '_ml25_g',    label: '毛利25增速',  sortable: true, sortKey: 'margin_25' },
    { key: '_ml24_g',    label: '毛利24',      sortable: true, sortKey: 'margin_24' },
    { key: '_ml23_g',    label: '毛利23',      sortable: true, sortKey: 'margin_23' },
    { key: 'margin_22',  label: '毛利22',      sortable: true },
    { key: '_np25_g',    label: '净利25增速',  sortable: true, sortKey: 'net_profit_25' },
    { key: '_np24_g',    label: '净利24',      sortable: true, sortKey: 'net_profit_24' },
    { key: '_np23_g',    label: '净利23',      sortable: true, sortKey: 'net_profit_23' },
    { key: 'net_profit_22', label: '净利22',   sortable: true },
  ],
  s3: [
    { key: 'code',    label: '代码',     align: 'left', sortable: false },
    { key: 'name',    label: '名称',     align: 'left', sortable: false },
    { key: 'industry',label: '行业',     align: 'left', sortable: false },
    { key: '_s_tags', label: '命中',     sortable: false },
    { key: '_rev25_g',   label: '营收25增速',  sortable: true, sortKey: 'revenue_25' },
    { key: '_rev24_g',   label: '营收24',      sortable: true, sortKey: 'revenue_24' },
    { key: '_rev23_g',   label: '营收23',      sortable: true, sortKey: 'revenue_23' },
    { key: 'revenue_22', label: '营收22',      sortable: true },
    { key: '_kp25_g',    label: '扣非25增速',  sortable: true, sortKey: 'k_profit_25' },
    { key: '_kp24_g',    label: '扣非24',      sortable: true, sortKey: 'k_profit_24' },
    { key: '_kp23_g',    label: '扣非23',      sortable: true, sortKey: 'k_profit_23' },
    { key: 'k_profit_22',label: '扣非22',      sortable: true },
  ],
  s4: [
    { key: 'code',    label: '代码',     align: 'left', sortable: false },
    { key: 'name',    label: '名称',     align: 'left', sortable: false },
    { key: 'industry',label: '行业',     align: 'left', sortable: false },
    { key: '_s_tags', label: '命中',     sortable: false },
    { key: '_trail4',      label: '增长期数',    sortable: false },
    { key: '_inst26q1_g',  label: '机构26Q1增速',sortable: true, sortKey: 'inst_26q1' },
    { key: '_inst25q4_g',  label: '机构25Q4',    sortable: true, sortKey: 'inst_25q4' },
    { key: '_inst25q3_g',  label: '机构25Q3',    sortable: true, sortKey: 'inst_25q3' },
    { key: '_inst25q2_g',  label: '机构25Q2',    sortable: true, sortKey: 'inst_25q2' },
  ],
};

const MULTI_COLS = [
  { key: 'code',        label: '代码',       align: 'left', sortable: false },
  { key: 'name',        label: '名称',       align: 'left', sortable: false },
  { key: 'industry',    label: '行业',       align: 'left', sortable: false },
  { key: '_s_tags',     label: '命中策略',   sortable: false },
  { key: 'quality_count', label: '质量分',   sortable: true },
  { key: 'top10_26q1',  label: '持股26Q1(万)', sortable: true },
  { key: 'roe_25',      label: 'ROE25',      sortable: true },
  { key: 'revenue_25',  label: '营收25(万)', sortable: true },
  { key: 'inst_26q1',   label: '机构26Q1(万)', sortable: true },
];

// ── 渲染单元格 ──
function renderCell(key, s) {
  switch (key) {
    case 'code':
      return '<td class="td-code align-left" onclick="goToStock(\'' + s.code + '\')">' + s.code + '</td>';
    case 'name':
      return '<td class="align-left"><span class="td-name" onclick="goToStock(\'' + s.code + '\')" title="' + (s.name||'') + '">' + (s.name||'') + '</span></td>';
    case 'industry':
      return '<td class="td-ind align-left" title="' + (s.industry||'') + '">' + (s.industry||'-') + '</td>';

    // ── S1 持股增长 ──
    case '_trail1': {
      var cnt = calcTrailCount([s.delta_26q1, s.delta_25q4, s.delta_25q3]);
      var cls = cnt >= 3 ? 'td-pos' : 'td-nil';
      var fw = cnt >= 3 ? 'font-weight:700' : '';
      return '<td><span class="' + cls + '" style="' + fw + '">' + cnt + '期</span></td>';
    }
    case '_26q1_g': {
      var g = s.top10_25q4 ? s.delta_26q1 / Math.abs(s.top10_25q4) : null;
      return '<td>' + fmtWithGrowth(s.top10_26q1, g) + '</td>';
    }
    case '_25q4_g': {
      var g = s.top10_25q3 ? s.delta_25q4 / Math.abs(s.top10_25q3) : null;
      return '<td>' + fmtWithGrowth(s.top10_25q4, g) + '</td>';
    }
    case '_25q3_g': {
      var g = s.top10_25q2 ? s.delta_25q3 / Math.abs(s.top10_25q2) : null;
      return '<td>' + fmtWithGrowth(s.top10_25q3, g) + '</td>';
    }
    case '_25q2_g':
      return '<td>' + fmtWithGrowth(s.top10_25q2, null) + '</td>';

    // ── S2 ROE ──
    case '_roe25_g': {
      var g = s.roe_24 ? (s.roe_25 - s.roe_24) / Math.abs(s.roe_24) : null;
      return '<td>' + fmtPctWithGrowth(s.roe_25, g) + '</td>';
    }
    case '_roe24_g': {
      var g = s.roe_23 ? (s.roe_24 - s.roe_23) / Math.abs(s.roe_23) : null;
      return '<td>' + fmtPctWithGrowth(s.roe_24, g) + '</td>';
    }
    case '_roe23_g': {
      var g = s.roe_22 ? (s.roe_23 - s.roe_22) / Math.abs(s.roe_22) : null;
      return '<td>' + fmtPctWithGrowth(s.roe_23, g) + '</td>';
    }
    // ── S2 毛利率 ──
    case '_ml25_g': {
      var g = s.margin_24 ? (s.margin_25 - s.margin_24) / Math.abs(s.margin_24) : null;
      return '<td>' + fmtPctWithGrowth(s.margin_25, g) + '</td>';
    }
    case '_ml24_g': {
      var g = s.margin_23 ? (s.margin_24 - s.margin_23) / Math.abs(s.margin_23) : null;
      return '<td>' + fmtPctWithGrowth(s.margin_24, g) + '</td>';
    }
    case '_ml23_g': {
      var g = s.margin_22 ? (s.margin_23 - s.margin_22) / Math.abs(s.margin_22) : null;
      return '<td>' + fmtPctWithGrowth(s.margin_23, g) + '</td>';
    }
    // ── S2 净利润 ──
    case '_np25_g': {
      var g = s.net_profit_24 ? (s.net_profit_25 - s.net_profit_24) / Math.abs(s.net_profit_24) : null;
      return '<td>' + fmtWithGrowth(s.net_profit_25, g) + '</td>';
    }
    case '_np24_g': {
      var g = s.net_profit_23 ? (s.net_profit_24 - s.net_profit_23) / Math.abs(s.net_profit_23) : null;
      return '<td>' + fmtWithGrowth(s.net_profit_24, g) + '</td>';
    }
    case '_np23_g': {
      var g = s.net_profit_22 ? (s.net_profit_23 - s.net_profit_22) / Math.abs(s.net_profit_22) : null;
      return '<td>' + fmtWithGrowth(s.net_profit_23, g) + '</td>';
    }

    // ── S3 营收 ──
    case '_rev25_g': {
      var g = s.revenue_24 ? (s.revenue_25 - s.revenue_24) / Math.abs(s.revenue_24) : null;
      return '<td>' + fmtWithGrowth(s.revenue_25, g) + '</td>';
    }
    case '_rev24_g': {
      var g = s.revenue_23 ? (s.revenue_24 - s.revenue_23) / Math.abs(s.revenue_23) : null;
      return '<td>' + fmtWithGrowth(s.revenue_24, g) + '</td>';
    }
    case '_rev23_g': {
      var g = s.revenue_22 ? (s.revenue_23 - s.revenue_22) / Math.abs(s.revenue_22) : null;
      return '<td>' + fmtWithGrowth(s.revenue_23, g) + '</td>';
    }
    // ── S3 扣非净利 ──
    case '_kp25_g': {
      var g = s.k_profit_24 ? (s.k_profit_25 - s.k_profit_24) / Math.abs(s.k_profit_24) : null;
      return '<td>' + fmtWithGrowth(s.k_profit_25, g) + '</td>';
    }
    case '_kp24_g': {
      var g = s.k_profit_23 ? (s.k_profit_24 - s.k_profit_23) / Math.abs(s.k_profit_23) : null;
      return '<td>' + fmtWithGrowth(s.k_profit_24, g) + '</td>';
    }
    case '_kp23_g': {
      var g = s.k_profit_22 ? (s.k_profit_23 - s.k_profit_22) / Math.abs(s.k_profit_22) : null;
      return '<td>' + fmtWithGrowth(s.k_profit_23, g) + '</td>';
    }

    // ── S4 机构持股 ──
    case '_trail4': {
      var cnt = calcTrailCount([s.inst_d1, s.inst_d2, s.inst_d3]);
      var cls = cnt >= 3 ? 'td-pos' : 'td-nil';
      var fw = cnt >= 3 ? 'font-weight:700' : '';
      return '<td><span class="' + cls + '" style="' + fw + '">' + cnt + '期</span></td>';
    }
    case '_inst26q1_g': {
      var g = s.inst_25q4 ? s.inst_d1 / Math.abs(s.inst_25q4) : null;
      return '<td>' + fmtWithGrowth(s.inst_26q1, g) + '</td>';
    }
    case '_inst25q4_g': {
      var g = s.inst_25q3 ? s.inst_d2 / Math.abs(s.inst_25q3) : null;
      return '<td>' + fmtWithGrowth(s.inst_25q4, g) + '</td>';
    }
    case '_inst25q3_g': {
      var g = s.inst_25q2 ? s.inst_d3 / Math.abs(s.inst_25q2) : null;
      return '<td>' + fmtWithGrowth(s.inst_25q3, g) + '</td>';
    }
    case '_inst25q2_g':
      return '<td>' + fmtWithGrowth(s.inst_25q2, null) + '</td>';

    // ── 通用字段 ──
    case 'roe_22':        return '<td>' + fmtNum(s.roe_22, 2) + '</td>';
    case 'margin_22':     return '<td>' + fmtNum(s.margin_22, 2) + '</td>';
    case 'net_profit_22': return '<td>' + fmtWan(s.net_profit_22) + '</td>';
    case 'revenue_22':    return '<td>' + fmtWan(s.revenue_22) + '</td>';
    case 'k_profit_22':   return '<td>' + fmtWan(s.k_profit_22) + '</td>';
    case 'top10_26q1':    return '<td>' + fmtWan(s.top10_26q1) + '</td>';
    case 'roe_25':        return '<td>' + fmtNum(s.roe_25, 2) + '</td>';
    case 'revenue_25':    return '<td>' + fmtWan(s.revenue_25) + '</td>';
    case 'inst_26q1':     return '<td>' + fmtWan(s.inst_26q1) + '</td>';
    case 'quality_count':
      return '<td>' + (s.quality_count > 0 ? '<span class="td-pos">' + s.quality_count + '/3</span>' : '<span class="td-nil">0</span>') + '</td>';
    case '_s_tags': {
      var t = [];
      if (s.s1) t.push('<span class="pill pill-blue">S1</span>');
      if (s.s2) t.push('<span class="pill pill-green">S2</span>');
      if (s.s3) t.push('<span class="pill pill-red">S3</span>');
      if (s.s4) t.push('<span class="pill pill-purple">S4</span>');
      return '<td>' + (t.join('') || '<span class="td-nil">—</span>') + '</td>';
    }
    default:
      return '<td>—</td>';
  }
}

// ── 渲染表头 ──
function buildHeader(cols) {
  var head = document.getElementById('tbl-head');
  var html = '<tr>';
  for (var i = 0; i < cols.length; i++) {
    var c = cols[i];
    var alignCls = c.align === 'left' ? ' align-left' : '';
    if (!c.sortable) {
      html += '<th class="no-sort' + alignCls + '">' + c.label + '</th>';
    } else {
      var sk = c.sortKey || c.key;
      var isSorted = sortState.col === sk;
      var arrow = isSorted ? (sortState.order === 'asc' ? ' ↑' : ' ↓') : '';
      html += '<th class="' + (isSorted ? 'sorted' : '') + alignCls + '" onclick="toggleSort(\'' + sk + '\')">' + c.label + arrow + '</th>';
    }
  }
  html += '</tr>';
  head.innerHTML = html;
}

// ── 初始化 ──
async function initPage() {
  try {
    const summary = await api.getStrategySummary();
    const c = summary.counts || {};
    document.getElementById('cnt-s1').textContent = (c.s1_count||0) + ' 只';
    document.getElementById('cnt-s2').textContent = (c.s2_count||0) + ' 只';
    document.getElementById('cnt-s3').textContent = (c.s3_count||0) + ' 只';
    document.getElementById('cnt-s4').textContent = (c.s4_count||0) + ' 只';
  } catch(e) {}

  const tab = new URLSearchParams(location.search).get('tab') || 's1';
  const validTabs = ['s1','s2','s3','s4'];
  selectCard(validTabs.includes(tab) ? tab : 's1');
}

// ── 卡片选择 ──
function selectCard(key) {
  currentCard = key;
  multiMode = false;
  ['s1','s2','s3','s4'].forEach(function(k) { document.getElementById('chk-'+k).checked = false; });
  document.querySelectorAll('.s-card').forEach(function(c) { c.classList.remove('active'); });
  var el = document.querySelector('[data-key="' + key + '"]');
  if (el) el.classList.add('active');
  sortState = { col: null, order: 'asc' };
  currentPage = 1;
  currentSector = null;
  loadStocks();
}

// ── 多选筛选 ──
function onMultiFilter() {
  const checked = ['s1','s2','s3','s4'].filter(function(k) { return document.getElementById('chk-'+k).checked; });
  if (checked.length === 0) {
    document.querySelectorAll('.s-card').forEach(function(c) { c.classList.remove('active'); });
    var el = document.querySelector('[data-key="' + currentCard + '"]');
    if (el) el.classList.add('active');
    multiMode = false;
    multiSelected = [];
  } else {
    multiMode = true;
    multiSelected = checked;
    document.querySelectorAll('.s-card').forEach(function(c) { c.classList.remove('active'); });
  }
  sortState = { col: null, order: 'asc' };
  currentPage = 1;
  currentSector = null;
  loadStocks();
}

// ── 加载股票 ──
async function loadStocks(page) {
  page = page || 1;
  currentPage = page;
  const colDef = multiMode ? MULTI_COLS : (COL_DEFS[currentCard] || MULTI_COLS);
  const sortCol = sortState.col || null;

  buildHeader(colDef);

  const tbody = document.getElementById('tbl-body');
  const colspan = colDef.length;
  tbody.innerHTML = '<tr><td colspan="' + colspan + '">' + loadingHtml() + '</td></tr>';
  document.getElementById('total-label').textContent = '';

  try {
    let data;
    if (multiMode && multiSelected.length > 0) {
      data = await api.get('/strategy/stocks', {
        strategies: multiSelected.join(','),
        page: page, limit: PAGE_SIZE,
        sort: sortCol || 'code',
        order: sortState.order,
      });
    } else {
      data = await api.getStrategyStocks(
        currentCard, page, PAGE_SIZE,
        sortCol || 'code', sortState.order
      );
    }

    allStocks = data.items || [];
    document.getElementById('total-label').textContent =
      '共 ' + data.total + ' 只 (第' + page + '/' + Math.ceil(data.total/PAGE_SIZE) + '页)';

    applySearch();

    document.getElementById('pagination').innerHTML =
      renderPagination(data.total, page, PAGE_SIZE, 'loadStocks');

    renderSectorSidebar();
  } catch (e) {
    tbody.innerHTML = '<tr><td colspan="' + colspan + '">' + emptyHtml('加载失败', e.message) + '</td></tr>';
  }
}

// ── 搜索 ──
function applySearch() {
  const q = document.getElementById('search-input').value.trim().toLowerCase();
  filteredStocks = q
    ? allStocks.filter(function(s) {
        return s.code.includes(q) || (s.name||'').toLowerCase().includes(q) ||
               (s.industry||'').toLowerCase().includes(q);
      })
    : allStocks;
  if (currentSector) {
    filteredStocks = filteredStocks.filter(function(s) { return (s.industry||'').startsWith(currentSector); });
  }
  renderTableRows();
}
function onSearch() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(applySearch, 200);
}

// ── 渲染表格行 ──
function renderTableRows() {
  const colDef = multiMode ? MULTI_COLS : (COL_DEFS[currentCard] || MULTI_COLS);
  const tbody = document.getElementById('tbl-body');
  if (!filteredStocks.length) {
    tbody.innerHTML = '<tr><td colspan="' + colDef.length + '">' + emptyHtml('没有找到股票') + '</td></tr>';
    return;
  }
  tbody.innerHTML = filteredStocks.map(function(s) {
    return '<tr>' + colDef.map(function(c) { return renderCell(c.key, s); }).join('') + '</tr>';
  }).join('');
}

// ── 板块侧边栏 ──
function renderSectorSidebar() {
  const sectorMap = {};
  allStocks.forEach(function(s) {
    const ind = (s.industry || '').split('-')[0] || '其他';
    sectorMap[ind] = (sectorMap[ind] || 0) + 1;
  });
  const sectors = Object.entries(sectorMap).sort(function(a,b) { return b[1] - a[1]; });

  const sideEl = document.getElementById('sector-list');
  let html = '<div class="sector-item ' + (!currentSector?'active':'') + '" onclick="filterSector(null)">' +
    '<span>全部</span><span class="s-cnt">' + allStocks.length + '</span></div>';
  sectors.forEach(function(entry) {
    const ind = entry[0], cnt = entry[1];
    const esc = ind.replace(/'/g, "\\'");
    html += '<div class="sector-item ' + (currentSector===ind?'active':'') + '" onclick="filterSector(\'' + esc + '\')">' +
      '<span>' + ind + '</span><span class="s-cnt">' + cnt + '</span></div>';
  });
  sideEl.innerHTML = html;
}

function filterSector(ind) {
  currentSector = ind;
  renderSectorSidebar();
  applySearch();
}

// ── 排序 ──
function toggleSort(col) {
  sortState.order = (sortState.col === col && sortState.order === 'asc') ? 'desc' : 'asc';
  sortState.col = col;
  loadStocks(currentPage);
}

function goToStock(code) {
  window.location.href = '/stock.html?code=' + code;
}

// ── 导出 CSV ──
function exportCsv() {
  if (!allStocks.length) { showToast('没有数据', 'err'); return; }
  const rows = [['代码','名称','行业','S1','S2','S3','S4']];
  allStocks.forEach(function(s) { rows.push([s.code,s.name,s.industry||'',s.s1?1:0,s.s2?1:0,s.s3?1:0,s.s4?1:0]); });
  const csv = rows.map(function(r) { return r.join(','); }).join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent('\ufeff'+csv);
  a.download = 'strategy_' + currentCard + '_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
  showToast('已导出 CSV');
}

initPage();
</script>
