<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>股票详情 — StrategyReview</title>
<link rel="stylesheet" href="/assets/css/main.css">
<style>
.stock-header {
  display: flex;
  align-items: flex-start;
  gap: 20px;
  margin-bottom: 28px;
  flex-wrap: wrap;
}
.stock-title h1 { font-size: 26px; font-weight: 800; margin-bottom: 4px; }
.stock-title p { color: var(--sub); font-size: 13px; }
.strategy-badges { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.strategy-badge {
  padding: 6px 16px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 700;
}
.detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.data-table { width: 100%; }
.data-table td { padding: 8px 12px; border-bottom: 1px solid var(--border); font-size: 13px; }
.data-table td:first-child { color: var(--sub); white-space: nowrap; width: 30%; }
.data-table tr:last-child td { border-bottom: none; }
.trend-row { display: flex; gap: 8px; align-items: center; }
.trend-num { 
  min-width: 70px; text-align: right; font-family: monospace; font-size: 12px;
}
.trend-arrow { font-size: 14px; }
.info-pill {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 11px;
  background: var(--bg3);
  border: 1px solid var(--border);
  margin: 2px;
}
.search-box {
  max-width: 400px;
  margin: 0 auto 32px;
  display: flex;
  gap: 10px;
}
</style>
</head>
<body>
<div id="nav-container"></div>

<div class="container-sm">
  <!-- 搜索框（未指定股票时显示）-->
  <div id="search-box-view">
    <h1 class="page-title">股票详情</h1>
    <p class="page-sub">搜索任意A股代码，查看策略命中详情</p>
    <div class="search-box">
      <input class="search-input" id="code-input" placeholder="输入6位股票代码，如 000001"
        maxlength="6" oninput="this.value=this.value.replace(/\D/g,'')">
      <button class="btn btn-gold" onclick="searchStock()">查询</button>
    </div>
    <div id="search-result"></div>
  </div>

  <!-- 详情展示 -->
  <div id="detail-view" style="display:none">
    <div class="back-btn" onclick="clearDetail()">← 返回搜索</div>
    <div id="stock-detail-content">
      <div class="loading"><div class="spinner"></div>加载中...</div>
    </div>
  </div>
</div>

<script src="/assets/js/api.js"></script>
<script src="/assets/js/components.js"></script>
<script>
document.getElementById('nav-container').innerHTML = renderNav('');
initNavStatus();

const urlCode = new URLSearchParams(location.search).get('code');
if (urlCode) {
  loadDetail(urlCode);
}

document.getElementById('code-input')?.addEventListener('keydown', e => {
  if (e.key === 'Enter') searchStock();
});

async function searchStock() {
  const code = document.getElementById('code-input').value.trim();
  if (code.length !== 6) {
    showToast('请输入完整的6位股票代码', 'err');
    return;
  }
  loadDetail(code);
}

async function loadDetail(code) {
  document.getElementById('search-box-view').style.display = 'none';
  document.getElementById('detail-view').style.display = 'block';
  document.getElementById('stock-detail-content').innerHTML = loadingHtml();

  try {
    const s = await api.getStock(code);
    renderDetail(s);
  } catch (e) {
    document.getElementById('stock-detail-content').innerHTML = `
      <div class="hl-box warning">
        <strong>未找到股票 ${code}</strong>
        <p style="margin-top:6px;font-size:12px">${e.message}</p>
        <p style="margin-top:4px;font-size:12px">该股票可能不在策略库中，或代码有误</p>
      </div>`;
  }
}

function clearDetail() {
  document.getElementById('search-box-view').style.display = 'block';
  document.getElementById('detail-view').style.display = 'none';
  history.pushState(null, '', '/stock.html');
}

function renderDetail(s) {
  const tagColors = { '三合一': 'gold', '持股增长': 'blue', '盈利质量': 'green', '全速前进': 'red', '机构持股': 'purple' };
  const badges = (s.strategies || []).map(st => {
    const color = tagColors[st.name] || 'gold';
    return `<span class="strategy-badge" style="background:rgba(var(--${color}-rgb,255,215,0),0.15);color:var(--${color});border:1px solid rgba(var(--${color}-rgb),0.4)">${st.name}</span>`;
  }).join('');

  const noHit = !s.any_hit ? '<div class="hl-box">该股票暂未命中任何策略</div>' : '';

  const fv = (v, dec=2) => v != null ? parseFloat(v).toFixed(dec) : '-';
  const fPct = (v) => v != null ? `${(parseFloat(v)*100).toFixed(2)}%` : '-';

  // S1 详情
  const s1 = s.s1_detail || {};
  const s1Html = s.s1 ? `
    <div class="card" style="margin-top:16px">
      <div class="section-title" style="color:var(--blue)">📦 持股增长（S1）详情</div>
      <div style="overflow-x:auto">
        <table class="data-table">
          <tr><td>十大股东 26Q1</td><td>${fv(s1.top10_26q1)} 万股</td></tr>
          <tr><td>十大股东 25Q4</td><td>${fv(s1.top10_25q4)} 万股</td></tr>
          <tr><td>十大股东 25Q3</td><td>${fv(s1.top10_25q3)} 万股</td></tr>
          <tr><td>十大股东 25Q2</td><td>${fv(s1.top10_25q2)} 万股</td></tr>
          <tr><td>十大股东 25Q1</td><td>${fv(s1.top10_25q1)} 万股</td></tr>
          <tr><td>十大股东 24Q4</td><td>${fv(s1.top10_24q4)} 万股</td></tr>
          <tr><td style="color:var(--blue)">Δ26Q1（26Q1-25Q4）</td><td style="color:var(--blue)">${fv(s1.delta_26q1)} 万股</td></tr>
          <tr><td>Δ25Q4（25Q4-25Q3）</td><td>${fv(s1.delta_25q4)} 万股</td></tr>
          <tr><td>Δ25Q3（25Q3-25Q2）</td><td>${fv(s1.delta_25q3)} 万股</td></tr>
          ${s1.s1_sub ? '<tr><td>子策略</td><td><span class="tag tag-gold">增速加速 ✓</span></td></tr>' : ''}
        </table>
      </div>
    </div>` : '';

  // S2 详情
  const s2 = s.s2_detail || {};
  const roe = s2.roe || [];
  const margin = s2.margin || [];
  const np = s2.net_profit || [];
  const s2Html = s.s2 ? `
    <div class="card" style="margin-top:16px">
      <div class="section-title" style="color:var(--green)">💹 盈利质量（S2）详情</div>
      <table class="data-table">
        <tr><th style="background:var(--bg3);padding:8px 12px;font-size:12px;color:var(--sub)">指标</th>
            <th style="background:var(--bg3);padding:8px 12px;font-size:12px;color:var(--sub)">25年</th>
            <th style="background:var(--bg3);padding:8px 12px;font-size:12px;color:var(--sub)">24年</th>
            <th style="background:var(--bg3);padding:8px 12px;font-size:12px;color:var(--sub)">23年</th>
            <th style="background:var(--bg3);padding:8px 12px;font-size:12px;color:var(--sub)">22年</th></tr>
        <tr><td>ROE</td><td class="up">${fPct(roe[0])}</td><td>${fPct(roe[1])}</td><td>${fPct(roe[2])}</td><td>${fPct(roe[3])}</td></tr>
        <tr><td>毛利率</td><td class="up">${fPct(margin[0])}</td><td>${fPct(margin[1])}</td><td>${fPct(margin[2])}</td><td>${fPct(margin[3])}</td></tr>
        <tr><td>扣非净利（亿）</td><td class="up">${fv(np[0])}</td><td>${fv(np[1])}</td><td>${fv(np[2])}</td><td>${fv(np[3])}</td></tr>
      </table>
      <div style="margin-top:10px;font-size:12px;color:var(--sub)">
        质量评分：<span style="color:var(--green)">${s2.quality_count}/3 项全部达标</span>
      </div>
    </div>` : '';

  // S3 详情
  const s3 = s.s3_detail || {};
  const rev = s3.revenue || [];
  const kp = s3.k_profit || [];
  const s3Html = s.s3 ? `
    <div class="card" style="margin-top:16px">
      <div class="section-title" style="color:var(--red)">🚀 全速前进（S3）详情</div>
      <table class="data-table">
        <tr><th style="background:var(--bg3);padding:8px 12px;font-size:12px;color:var(--sub)">指标</th>
            <th style="background:var(--bg3);padding:8px 12px;font-size:12px;color:var(--sub)">25年</th>
            <th style="background:var(--bg3);padding:8px 12px;font-size:12px;color:var(--sub)">24年</th>
            <th style="background:var(--bg3);padding:8px 12px;font-size:12px;color:var(--sub)">23年</th>
            <th style="background:var(--bg3);padding:8px 12px;font-size:12px;color:var(--sub)">22年</th>
            <th style="background:var(--bg3);padding:8px 12px;font-size:12px;color:var(--sub)">21年</th></tr>
        <tr><td>扣非净利（亿）</td>
            <td class="${s3.k_acc?'up':''}">${fv(kp[0])}</td>
            <td>${fv(kp[1])}</td><td>${fv(kp[2])}</td><td>${fv(kp[3])}</td><td>${fv(kp[4])}</td></tr>
        <tr><td>营业收入（亿）</td>
            <td class="${s3.y_acc?'up':''}">${fv(rev[0])}</td>
            <td>${fv(rev[1])}</td><td>${fv(rev[2])}</td><td>${fv(rev[3])}</td><td>${fv(rev[4])}</td></tr>
      </table>
      <div style="margin-top:10px;display:flex;gap:8px">
        ${s3.k_acc ? '<span class="tag tag-red">净利增速加速 ✓</span>' : ''}
        ${s3.y_acc ? '<span class="tag tag-blue">营收增速加速 ✓</span>' : ''}
      </div>
    </div>` : '';

  // 基础信息
  const concepts = s.concepts || [];
  const conceptsHtml = concepts.length
    ? concepts.map(c => `<span class="info-pill">${c}</span>`).join('')
    : '<span style="color:var(--sub)">-</span>';

  document.getElementById('stock-detail-content').innerHTML = `
    <div class="stock-header">
      <div class="stock-title">
        <h1>${s.name} <span style="color:var(--sub);font-size:20px">${s.code}</span></h1>
        <p>${s.industry || '未知行业'}</p>
        <div class="strategy-badges">
          ${badges || '<span style="color:var(--sub);font-size:13px">未命中策略</span>'}
        </div>
      </div>
    </div>

    ${noHit}

    <div class="detail-grid">
      <div class="card">
        <div class="section-title">基础信息</div>
        <table class="data-table">
          <tr><td>主营业务</td><td>${s.main_business || '-'}</td></tr>
          <tr><td>PE</td><td>${s.pe != null ? fv(s.pe) + 'x' : '-'}</td></tr>
          <tr><td>PB</td><td>${s.pb != null ? fv(s.pb) + 'x' : '-'}</td></tr>
          <tr><td>市值</td><td>${s.market_cap != null ? fv(s.market_cap/1e8) + ' 亿' : '-'}</td></tr>
          <tr><td>数据版本</td><td>${s.data_version || '-'}</td></tr>
        </table>
      </div>
      <div class="card">
        <div class="section-title">概念板块</div>
        <div>${conceptsHtml}</div>
      </div>
    </div>

    ${s1Html}
    ${s2Html}
    ${s3Html}`;
}
</script>
</body>
</html>
