<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>股票详情 — StrategyReview</title>
<link rel="stylesheet" href="/assets/css/main.css">
<style>
/* ── 头部 ── */
.stock-hero {
  background: var(--bg2);
  border-radius: 16px;
  border: 1px solid var(--border);
  padding: 24px 28px;
  margin-bottom: 20px;
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
  align-items: flex-start;
}
.stock-hero-left { flex: 1; min-width: 200px; }
.stock-hero h1 { font-size: 26px; font-weight: 800; margin-bottom: 4px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.stock-code-badge { font-size: 14px; font-weight: 400; font-family: monospace; color: var(--blue); background: rgba(77,171,247,0.1); padding: 2px 8px; border-radius: 6px; }
.stock-industry { color: var(--sub); font-size: 13px; margin-bottom: 10px; }
.s-pills { display: flex; gap: 6px; flex-wrap: wrap; }
.s-pill {
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 700;
  border: 1px solid;
}
/* ── 跟踪备注（黄金边框）── */
.tracking-box {
  border: 2px solid var(--gold);
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 20px;
  background: rgba(255,215,0,0.04);
}
.tracking-box h3 { color: var(--gold); font-size: 14px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
.tracking-textarea {
  width: 100%;
  min-height: 100px;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-size: 13px;
  padding: 10px 12px;
  resize: vertical;
  font-family: inherit;
  line-height: 1.6;
}
.tracking-textarea:focus { outline: none; border-color: var(--gold); }
.tracking-actions { display: flex; align-items: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
.tracking-actions .saved-hint { font-size: 12px; color: var(--green); opacity: 0; transition: opacity .3s; }
.tracking-actions .saved-hint.show { opacity: 1; }
/* ── 信息卡 ── */
.info-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 20px;
}
@media(max-width:700px){ .info-grid { grid-template-columns: 1fr; } }
.info-kv { display: flex; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.info-kv .ik { color: var(--sub); white-space: nowrap; min-width: 70px; }
.info-kv .iv { color: var(--text); flex: 1; }
.concept-pill { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; background: var(--bg3); border: 1px solid var(--border); margin: 2px; }
/* ── 策略段落 ── */
.strategy-section { margin-bottom: 20px; }
.ss-title {
  font-size: 14px;
  font-weight: 700;
  padding: 8px 0;
  margin-bottom: 12px;
  border-bottom: 2px solid;
  display: flex;
  align-items: center;
  gap: 8px;
}
/* ── 数据表 ── */
.dt { width: 100%; border-collapse: collapse; font-size: 13px; overflow-x: auto; }
.dt thead th {
  background: var(--bg3);
  color: var(--sub);
  padding: 7px 12px;
  text-align: right;
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
  border-bottom: 1px solid var(--border);
}
.dt thead th:first-child { text-align: left; }
.dt tbody td {
  padding: 7px 12px;
  text-align: right;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
.dt tbody td:first-child { text-align: left; color: var(--sub); font-size: 12px; white-space: nowrap; }
.dt tbody tr:last-child td { border-bottom: none; }
.dt-pos { color: var(--red); }
.dt-neg { color: var(--green); }
.dt-nil { color: var(--sub); }
.dt-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
/* ── 搜索框 ── */
.search-box { max-width: 420px; margin: 0 auto 32px; display: flex; gap: 10px; }
</style>
</head>
<body>
<div id="nav-container"></div>

<div class="container-sm">
  <!-- 搜索框（未指定时显示）-->
  <div id="search-box-view">
    <h1 class="page-title">股票详情</h1>
    <p class="page-sub">搜索任意A股代码，查看策略命中与财报数据</p>
    <div class="search-box">
      <input class="search-input" id="code-input" placeholder="输入6位股票代码，如 000001"
        maxlength="6" oninput="this.value=this.value.replace(/\D/g,'')">
      <button class="btn btn-gold" onclick="searchStock()">查询</button>
    </div>
    <div id="search-result"></div>
  </div>

  <!-- 详情视图 -->
  <div id="detail-view" style="display:none">
    <div class="back-btn" onclick="clearDetail()">← 返回搜索</div>
    <div id="detail-content">
      <div class="loading"><div class="spinner"></div>加载中...</div>
    </div>
  </div>
</div>

<script src="/assets/js/api.js"></script>
<script src="/assets/js/components.js"></script>
<script>
document.getElementById('nav-container').innerHTML = renderNav('');
initNavStatus();

const urlCode = new URLSearchParams(location.search).get('code');
if (urlCode) loadDetail(urlCode);

document.getElementById('code-input')?.addEventListener('keydown', e => {
  if (e.key === 'Enter') searchStock();
});

function searchStock() {
  const code = document.getElementById('code-input').value.trim();
  if (code.length !== 6) { showToast('请输入完整的6位股票代码', 'err'); return; }
  loadDetail(code);
}

async function loadDetail(code) {
  document.getElementById('search-box-view').style.display = 'none';
  document.getElementById('detail-view').style.display = 'block';
  document.getElementById('detail-content').innerHTML = loadingHtml();
  try {
    const s = await api.getStock(code);
    renderDetail(s);
  } catch(e) {
    document.getElementById('detail-content').innerHTML = `
      <div class="hl-box warning">
        <strong>未找到股票 ${code}</strong>
        <p style="margin-top:6px;font-size:12px">${e.message}</p>
        <p style="margin-top:4px;font-size:12px">该股票可能不在策略库中，或代码有误</p>
      </div>`;
  }
}

function clearDetail() {
  document.getElementById('search-box-view').style.display = 'block';
  document.getElementById('detail-view').style.display = 'none';
  history.pushState(null, '', '/stock.html');
}

// ── 格式化 ──
const W = 10000;
function fv(v, dec=2) { return v != null ? parseFloat(v).toFixed(dec) : '—'; }
function fWan(v) { return v != null ? (v/W).toFixed(1) : null; }
function fPctDirect(v) { return v != null ? parseFloat(v).toFixed(2) + '%' : '—'; }
function growthHtml(curr, prev) {
  if (curr == null || prev == null || prev === 0) return '<span class="dt-nil">—</span>';
  const g = (curr - prev) / Math.abs(prev);
  const pct = (g * 100).toFixed(1);
  const cls = g > 0 ? 'dt-pos' : g < 0 ? 'dt-neg' : 'dt-nil';
  return `<span class="${cls}">${g > 0 ? '+' : ''}${pct}%</span>`;
}
function numHtml(v, dec=1) {
  if (v == null) return '<span class="dt-nil">—</span>';
  return parseFloat(v).toFixed(dec);
}
function deltaHtml(v) {
  if (v == null) return '<span class="dt-nil">—</span>';
  const w = (v/W).toFixed(1);
  const cls = v > 0 ? 'dt-pos' : v < 0 ? 'dt-neg' : 'dt-nil';
  return `<span class="${cls}">${v > 0 ? '+' : ''}${w}</span>`;
}
function wanHtml(v) {
  if (v == null) return '<span class="dt-nil">—</span>';
  return (v/W).toFixed(1);
}

// ── 跟踪备注 localStorage ──
let currentCode = '';
function loadTracking(code) {
  const saved = localStorage.getItem('track_' + code);
  document.getElementById('track-notes').value = saved || '';
}
function saveTracking() {
  const val = document.getElementById('track-notes').value;
  localStorage.setItem('track_' + currentCode, val);
  const hint = document.getElementById('saved-hint');
  hint.classList.add('show');
  setTimeout(() => hint.classList.remove('show'), 2000);
}
function clearTracking() {
  if (!confirm('确定清除该股票的备注？')) return;
  localStorage.removeItem('track_' + currentCode);
  document.getElementById('track-notes').value = '';
  showToast('已清除');
}

// ── 渲染详情 ──
function renderDetail(s) {
  currentCode = s.code;

  // 策略标签
  const pillConf = {
    s1: { label: 'S1 持股增长', color: 'var(--blue)', bg: 'rgba(77,171,247,0.15)' },
    s2: { label: 'S2 盈利质量', color: 'var(--green)', bg: 'rgba(81,207,102,0.15)' },
    s3: { label: 'S3 全速前进', color: 'var(--red)', bg: 'rgba(255,107,107,0.15)' },
    s4: { label: 'S4 机构持股', color: 'var(--purple)', bg: 'rgba(204,93,232,0.15)' },
  };
  const pillsHtml = Object.entries(pillConf)
    .filter(([k]) => s[k])
    .map(([k, c]) => `<span class="s-pill" style="color:${c.color};background:${c.bg};border-color:${c.color}">${c.label}</span>`)
    .join('');

  // 概念板块
  const concepts = s.concepts || [];
  const conceptsHtml = concepts.length
    ? concepts.map(c => `<span class="concept-pill">${c}</span>`).join('')
    : '<span class="dt-nil">—</span>';

  // ── S1 表格 ──
  const s1 = s.s1_detail || {};
  const s1Html = s.s1 ? `
    <div class="strategy-section">
      <div class="ss-title" style="color:var(--blue);border-color:var(--blue)">📦 S1 持股增长</div>
      <div class="dt-wrap">
        <table class="dt">
          <thead><tr>
            <th style="text-align:left">指标</th>
            <th>26Q1</th><th>25Q4</th><th>25Q3</th>
            <th>25Q2</th><th>25Q1</th><th>24Q4</th>
            <th>Δ26Q1</th><th>Δ25Q4</th><th>Δ25Q3</th>
          </tr></thead>
          <tbody><tr>
            <td>十大股东持股（万股）</td>
            <td>${wanHtml(s1.top10_26q1)}</td>
            <td>${wanHtml(s1.top10_25q4)}</td>
            <td>${wanHtml(s1.top10_25q3)}</td>
            <td>${wanHtml(s1.top10_25q2)}</td>
            <td>${wanHtml(s1.top10_25q1)}</td>
            <td>${wanHtml(s1.top10_24q4)}</td>
            <td>${deltaHtml(s1.delta_26q1)}</td>
            <td>${deltaHtml(s1.delta_25q4)}</td>
            <td>${deltaHtml(s1.delta_25q3)}</td>
          </tr></tbody>
        </table>
      </div>
      ${s1.s1_sub ? '<div style="margin-top:8px"><span class="s-pill" style="color:var(--blue);background:rgba(77,171,247,0.1);border-color:var(--blue)">子策略：增速加速</span></div>' : ''}
    </div>` : '';

  // ── S2 表格 ──
  const s2 = s.s2_detail || {};
  const roe = s2.roe || [null,null,null,null];
  const margin = s2.margin || [null,null,null,null];
  const np = s2.net_profit || [null,null,null,null];
  const s2Html = s.s2 ? `
    <div class="strategy-section">
      <div class="ss-title" style="color:var(--green);border-color:var(--green)">💹 S2 盈利质量</div>
      <div class="dt-wrap">
        <table class="dt">
          <thead><tr>
            <th style="text-align:left">指标</th>
            <th>2025</th><th>2024</th><th>2023</th><th>2022</th><th>增速(25vs24)</th>
          </tr></thead>
          <tbody>
            <tr>
              <td>ROE (%)</td>
              <td>${numHtml(roe[0])}</td><td>${numHtml(roe[1])}</td>
              <td>${numHtml(roe[2])}</td><td>${numHtml(roe[3])}</td>
              <td>${growthHtml(roe[0], roe[1])}</td>
            </tr>
            <tr>
              <td>毛利率 (%)</td>
              <td>${numHtml(margin[0])}</td><td>${numHtml(margin[1])}</td>
              <td>${numHtml(margin[2])}</td><td>${numHtml(margin[3])}</td>
              <td>${growthHtml(margin[0], margin[1])}</td>
            </tr>
            <tr>
              <td>扣非净利 (万)</td>
              <td>${wanHtml(np[0])}</td><td>${wanHtml(np[1])}</td>
              <td>${wanHtml(np[2])}</td><td>${wanHtml(np[3])}</td>
              <td>${growthHtml(np[0], np[1])}</td>
            </tr>
          </tbody>
        </table>
      </div>
      <div style="margin-top:8px;font-size:12px">
        质量评分：<span style="color:var(--green);font-weight:700">${s2.quality_count || 0}/3 项达标</span>
        ${s2.roe_up ? ' · <span style="color:var(--green)">ROE↑</span>' : ''}
        ${s2.m_up ? ' · <span style="color:var(--green)">毛利率↑</span>' : ''}
        ${s2.k_up ? ' · <span style="color:var(--green)">扣非净利↑</span>' : ''}
      </div>
    </div>` : '';

  // ── S3 表格 ──
  const s3 = s.s3_detail || {};
  const rev = s3.revenue || [null,null,null,null,null];
  const kp = s3.k_profit || [null,null,null,null,null];
  const s3Html = s.s3 ? `
    <div class="strategy-section">
      <div class="ss-title" style="color:var(--red);border-color:var(--red)">🚀 S3 全速前进</div>
      <div class="dt-wrap">
        <table class="dt">
          <thead><tr>
            <th style="text-align:left">指标</th>
            <th>2025</th><th>2024</th><th>2023</th><th>2022</th><th>增速(25vs24)</th>
          </tr></thead>
          <tbody>
            <tr>
              <td>营业收入 (万)</td>
              <td>${wanHtml(rev[0])}</td><td>${wanHtml(rev[1])}</td>
              <td>${wanHtml(rev[2])}</td><td>${wanHtml(rev[3])}</td>
              <td>${growthHtml(rev[0], rev[1])}</td>
            </tr>
            <tr>
              <td>扣非净利 (万)</td>
              <td>${wanHtml(kp[0])}</td><td>${wanHtml(kp[1])}</td>
              <td>${wanHtml(kp[2])}</td><td>${wanHtml(kp[3])}</td>
              <td>${growthHtml(kp[0], kp[1])}</td>
            </tr>
          </tbody>
        </table>
      </div>
      <div style="margin-top:8px;font-size:12px">
        ${s3.k_acc ? '<span class="s-pill" style="color:var(--red);background:rgba(255,107,107,0.1);border-color:var(--red);margin-right:6px">净利增速加速 ✓</span>' : ''}
        ${s3.y_acc ? '<span class="s-pill" style="color:var(--blue);background:rgba(77,171,247,0.1);border-color:var(--blue)">营收增速加速 ✓</span>' : ''}
      </div>
    </div>` : '';

  // ── S4 表格 ──
  const s4 = s.s4_detail || {};
  const s4Html = s.s4 ? `
    <div class="strategy-section">
      <div class="ss-title" style="color:var(--purple);border-color:var(--purple)">🏛 S4 机构持股</div>
      <div class="dt-wrap">
        <table class="dt">
          <thead><tr>
            <th style="text-align:left">指标</th>
            <th>26Q1</th><th>25Q4</th><th>25Q3</th><th>25Q2</th>
            <th>Δ26Q1</th><th>Δ25Q4</th><th>Δ25Q3</th>
          </tr></thead>
          <tbody><tr>
            <td>机构持股 (万股)</td>
            <td>${wanHtml(s4.inst_26q1)}</td>
            <td>${wanHtml(s4.inst_25q4)}</td>
            <td>${wanHtml(s4.inst_25q3)}</td>
            <td>${wanHtml(s4.inst_25q2)}</td>
            <td>${deltaHtml(s4.inst_d1)}</td>
            <td>${deltaHtml(s4.inst_d2)}</td>
            <td>${deltaHtml(s4.inst_d3)}</td>
          </tr></tbody>
        </table>
      </div>
      ${s4.s4_sub ? '<div style="margin-top:8px"><span class="s-pill" style="color:var(--purple);background:rgba(204,93,232,0.1);border-color:var(--purple)">子策略：增速加速</span></div>' : ''}
    </div>` : '';

  document.getElementById('detail-content').innerHTML = `
    <!-- 股票头部 -->
    <div class="stock-hero">
      <div class="stock-hero-left">
        <h1>
          ${s.name}
          <span class="stock-code-badge">${s.code}</span>
        </h1>
        <div class="stock-industry">${s.industry || '未知行业'}</div>
        <div class="s-pills">
          ${pillsHtml || '<span style="color:var(--sub);font-size:12px">未命中任何策略</span>'}
        </div>
      </div>
    </div>

    <!-- 跟踪备注 -->
    <div class="tracking-box">
      <h3>📝 跟踪备注</h3>
      <textarea class="tracking-textarea" id="track-notes" placeholder="记录您的观察、买卖记录、关注点..."></textarea>
      <div class="tracking-actions">
        <button class="btn btn-gold btn-sm" onclick="saveTracking()">💾 保存</button>
        <button class="btn btn-outline btn-sm" onclick="clearTracking()">🗑 清除</button>
        <span class="saved-hint" id="saved-hint">✓ 已保存</span>
        <span style="font-size:11px;color:var(--sub);margin-left:auto">数据存储在浏览器本地</span>
      </div>
    </div>

    <!-- 基础信息 -->
    <div class="info-grid">
      <div class="card">
        <div class="section-title">基础信息</div>
        <div class="info-kv"><span class="ik">主营业务</span><span class="iv" style="font-size:12px">${s.main_business || '—'}</span></div>
        <div class="info-kv"><span class="ik">PE</span><span class="iv">${s.pe != null ? fv(s.pe,2) + 'x' : '—'}</span></div>
        <div class="info-kv"><span class="ik">PB</span><span class="iv">${s.pb != null ? fv(s.pb,2) + 'x' : '—'}</span></div>
        <div class="info-kv"><span class="ik">市值</span><span class="iv">${s.market_cap != null ? (s.market_cap/1e8).toFixed(2) + ' 亿' : '—'}</span></div>
        <div class="info-kv"><span class="ik">数据版本</span><span class="iv">${s.data_version || '—'}</span></div>
      </div>
      <div class="card">
        <div class="section-title">概念板块</div>
        <div>${conceptsHtml}</div>
      </div>
    </div>

    <!-- 策略详情 -->
    ${s1Html}
    ${s2Html}
    ${s3Html}
    ${s4Html}
    ${!s.any_hit ? '<div class="hl-box" style="margin-top:16px">该股票暂未命中任何策略</div>' : ''}
  `;

  // 加载保存的备注
  loadTracking(s.code);

  // 更新页面标题
  document.title = `${s.name} (${s.code}) — StrategyReview`;
}
</script>
</body>
</html>

<style>
.stock-header {
  display: flex;
  align-items: flex-start;
  gap: 20px;
  margin-bottom: 28px;
  flex-wrap: wrap;
}
.stock-title h1 { font-size: 26px; font-weight: 800; margin-bottom: 4px; }

.strategy-badges { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.strategy-badge {
  padding: 6px 16px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 700;
}

.data-table { width: 100%; }
.data-table td { padding: 8px 12px; border-bottom: 1px solid var(--border); font-size: 13px; }
.data-table td:first-child { color: var(--sub); white-space: nowrap; width: 30%; }
.data-table tr:last-child td { border-bottom: none; }
.trend-row { display: flex; gap: 8px; align-items: center; }

  min-width: 70px; text-align: right; font-family: monospace; font-size: 12px;
}
.trend-arrow { font-size: 14px; }

  display: inline-block;

  background: var(--bg3);
  border: 1px solid var(--border);
  margin: 2px;
}
.search-box {
  max-width: 400px;
  margin: 0 auto 32px;
  display: flex;
  gap: 10px;
}
</style>
</head>
<body>
<div id="nav-container"></div>

<div class="container-sm">
  <!-- 搜索框（未指定股票时显示）-->
  <div id="search-box-view">
    <h1 class="page-title">股票详情</h1>
    <p class="page-sub">搜索任意A股代码，查看策略命中详情</p>
    <div class="search-box">
      <input class="search-input" id="code-input" placeholder="输入6位股票代码，如 000001"
        maxlength="6" oninput="this.value=this.value.replace(/\D/g,'')">
      <button class="btn btn-gold" onclick="searchStock()">查询</button>
    </div>
    <div id="search-result"></div>
  </div>

  <!-- 详情展示 -->
  <div id="detail-view" style="display:none">
    <div class="back-btn" onclick="clearDetail()">← 返回搜索</div>
    <div id="stock-detail-content">
      <div class="loading"><div class="spinner"></div>加载中...</div>
    </div>
  </div>
</div>

<script src="/assets/js/api.js"></script>
<script src="/assets/js/components.js"></script>
<script>
document.getElementById('nav-container').innerHTML = renderNav('');
initNavStatus();

const urlCode = new URLSearchParams(location.search).get('code');
if (urlCode) {
  loadDetail(urlCode);
}

document.getElementById('code-input')?.addEventListener('keydown', e => {
  if (e.key === 'Enter') searchStock();
});

async function searchStock() {
  const code = document.getElementById('code-input').value.trim();
  if (code.length !== 6) {
    showToast('请输入完整的6位股票代码', 'err');
    return;
  }
  loadDetail(code);
}

async function loadDetail(code) {
  document.getElementById('search-box-view').style.display = 'none';
  document.getElementById('detail-view').style.display = 'block';
  document.getElementById('stock-detail-content').innerHTML = loadingHtml();

  try {
    const s = await api.getStock(code);
    renderDetail(s);
  } catch (e) {
    document.getElementById('stock-detail-content').innerHTML = `
      <div class="hl-box warning">
        <strong>未找到股票 ${code}</strong>
        <p style="margin-top:6px;font-size:12px">${e.message}</p>
        <p style="margin-top:4px;font-size:12px">该股票可能不在策略库中，或代码有误</p>
      </div>`;
  }
}

function clearDetail() {
  document.getElementById('search-box-view').style.display = 'block';
  document.getElementById('detail-view').style.display = 'none';
  history.pushState(null, '', '/stock.html');
}

function renderDetail(s) {
  const tagColors = { '三合一': 'gold', '持股增长': 'blue', '盈利质量': 'green', '全速前进': 'red', '机构持股': 'purple' };
  const badges = (s.strategies || []).map(st => {
    const color = tagColors[st.name] || 'gold';
    return `<span class="strategy-badge" style="background:rgba(var(--${color}-rgb,255,215,0),0.15);color:var(--${color});border:1px solid rgba(var(--${color}-rgb),0.4)">${st.name}</span>`;
  }).join('');

  const noHit = !s.any_hit ? '<div class="hl-box">该股票暂未命中任何策略</div>' : '';

  const fv = (v, dec=2) => v != null ? parseFloat(v).toFixed(dec) : '-';
  const fPct = (v) => v != null ? `${(parseFloat(v)*100).toFixed(2)}%` : '-';

  // S1 详情
  const s1 = s.s1_detail || {};
  const s1Html = s.s1 ? `
    <div class="card" style="margin-top:16px">
      <div class="section-title" style="color:var(--blue)">📦 持股增长（S1）详情</div>
      <div style="overflow-x:auto">
        <table class="data-table">
          <tr><td>十大股东 26Q1</td><td>${fv(s1.top10_26q1)} 万股</td></tr>
          <tr><td>十大股东 25Q4</td><td>${fv(s1.top10_25q4)} 万股</td></tr>
          <tr><td>十大股东 25Q3</td><td>${fv(s1.top10_25q3)} 万股</td></tr>
          <tr><td>十大股东 25Q2</td><td>${fv(s1.top10_25q2)} 万股</td></tr>
          <tr><td>十大股东 25Q1</td><td>${fv(s1.top10_25q1)} 万股</td></tr>
          <tr><td>十大股东 24Q4</td><td>${fv(s1.top10_24q4)} 万股</td></tr>
          <tr><td style="color:var(--blue)">Δ26Q1（26Q1-25Q4）</td><td style="color:var(--blue)">${fv(s1.delta_26q1)} 万股</td></tr>
          <tr><td>Δ25Q4（25Q4-25Q3）</td><td>${fv(s1.delta_25q4)} 万股</td></tr>
          <tr><td>Δ25Q3（25Q3-25Q2）</td><td>${fv(s1.delta_25q3)} 万股</td></tr>
          ${s1.s1_sub ? '<tr><td>子策略</td><td><span class="tag tag-gold">增速加速 ✓</span></td></tr>' : ''}
        </table>
      </div>
    </div>` : '';

  // S2 详情
  const s2 = s.s2_detail || {};
  const roe = s2.roe || [];
  const margin = s2.margin || [];
  const np = s2.net_profit || [];
  const s2Html = s.s2 ? `
    <div class="card" style="margin-top:16px">
      <div class="section-title" style="color:var(--green)">💹 盈利质量（S2）详情</div>
      <table class="data-table">
        <tr><th style="background:var(--bg3);padding:8px 12px;font-size:12px;color:var(--sub)">指标</th>
            <th style="background:var(--bg3);padding:8px 12px;font-size:12px;color:var(--sub)">25年</th>
            <th style="background:var(--bg3);padding:8px 12px;font-size:12px;color:var(--sub)">24年</th>
            <th style="background:var(--bg3);padding:8px 12px;font-size:12px;color:var(--sub)">23年</th>
            <th style="background:var(--bg3);padding:8px 12px;font-size:12px;color:var(--sub)">22年</th></tr>
        <tr><td>ROE</td><td class="up">${fPct(roe[0])}</td><td>${fPct(roe[1])}</td><td>${fPct(roe[2])}</td><td>${fPct(roe[3])}</td></tr>
        <tr><td>毛利率</td><td class="up">${fPct(margin[0])}</td><td>${fPct(margin[1])}</td><td>${fPct(margin[2])}</td><td>${fPct(margin[3])}</td></tr>
        <tr><td>扣非净利（亿）</td><td class="up">${fv(np[0])}</td><td>${fv(np[1])}</td><td>${fv(np[2])}</td><td>${fv(np[3])}</td></tr>
      </table>
      <div style="margin-top:10px;font-size:12px;color:var(--sub)">
        质量评分：<span style="color:var(--green)">${s2.quality_count}/3 项全部达标</span>
      </div>
    </div>` : '';

  // S3 详情
  const s3 = s.s3_detail || {};
  const rev = s3.revenue || [];
  const kp = s3.k_profit || [];
  const s3Html = s.s3 ? `
    <div class="card" style="margin-top:16px">
      <div class="section-title" style="color:var(--red)">🚀 全速前进（S3）详情</div>
      <table class="data-table">
        <tr><th style="background:var(--bg3);padding:8px 12px;font-size:12px;color:var(--sub)">指标</th>
            <th style="background:var(--bg3);padding:8px 12px;font-size:12px;color:var(--sub)">25年</th>
            <th style="background:var(--bg3);padding:8px 12px;font-size:12px;color:var(--sub)">24年</th>
            <th style="background:var(--bg3);padding:8px 12px;font-size:12px;color:var(--sub)">23年</th>
            <th style="background:var(--bg3);padding:8px 12px;font-size:12px;color:var(--sub)">22年</th>
            <th style="background:var(--bg3);padding:8px 12px;font-size:12px;color:var(--sub)">21年</th></tr>
        <tr><td>扣非净利（亿）</td>
            <td class="${s3.k_acc?'up':''}">${fv(kp[0])}</td>
            <td>${fv(kp[1])}</td><td>${fv(kp[2])}</td><td>${fv(kp[3])}</td><td>${fv(kp[4])}</td></tr>
        <tr><td>营业收入（亿）</td>
            <td class="${s3.y_acc?'up':''}">${fv(rev[0])}</td>
            <td>${fv(rev[1])}</td><td>${fv(rev[2])}</td><td>${fv(rev[3])}</td><td>${fv(rev[4])}</td></tr>
      </table>
      <div style="margin-top:10px;display:flex;gap:8px">
        ${s3.k_acc ? '<span class="tag tag-red">净利增速加速 ✓</span>' : ''}
        ${s3.y_acc ? '<span class="tag tag-blue">营收增速加速 ✓</span>' : ''}
      </div>
    </div>` : '';

  // 基础信息
  const concepts = s.concepts || [];
  const conceptsHtml = concepts.length
    ? concepts.map(c => `<span class="info-pill">${c}</span>`).join('')
    : '<span style="color:var(--sub)">-</span>';

  document.getElementById('stock-detail-content').innerHTML = `
    <div class="stock-header">
      <div class="stock-title">
        <h1>${s.name} <span style="color:var(--sub);font-size:20px">${s.code}</span></h1>
        <p>${s.industry || '未知行业'}</p>
        <div class="strategy-badges">
          ${badges || '<span style="color:var(--sub);font-size:13px">未命中策略</span>'}
        </div>
      </div>
    </div>

    ${noHit}

    <div class="detail-grid">
      <div class="card">
        <div class="section-title">基础信息</div>
        <table class="data-table">
          <tr><td>主营业务</td><td>${s.main_business || '-'}</td></tr>
          <tr><td>PE</td><td>${s.pe != null ? fv(s.pe) + 'x' : '-'}</td></tr>
          <tr><td>PB</td><td>${s.pb != null ? fv(s.pb) + 'x' : '-'}</td></tr>
          <tr><td>市值</td><td>${s.market_cap != null ? fv(s.market_cap/1e8) + ' 亿' : '-'}</td></tr>
          <tr><td>数据版本</td><td>${s.data_version || '-'}</td></tr>
        </table>
      </div>
      <div class="card">
        <div class="section-title">概念板块</div>
        <div>${conceptsHtml}</div>
      </div>
    </div>

    ${s1Html}
    ${s2Html}
    ${s3Html}`;
}
</script>
</body>
</html>
