<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StrategyReview — A股策略复盘平台</title>
<link rel="stylesheet" href="/assets/css/main.css">
<style>
.quick-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 32px; }
.quick-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 24px;
  cursor: pointer;
  transition: all 0.25s;
  text-align: center;
}
.quick-card:hover { border-color: var(--gold); transform: translateY(-2px); }
.quick-card .icon { font-size: 36px; margin-bottom: 12px; }
.quick-card h3 { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
.quick-card p { font-size: 12px; color: var(--sub); }
.quick-card .stat { font-size: 28px; font-weight: 800; color: var(--gold); margin: 8px 0; }
.update-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 12px;
  margin-bottom: 24px;
}
.review-list { display: flex; flex-direction: column; gap: 10px; }
.review-item {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  transition: border-color 0.2s;
}
.review-item:hover { border-color: rgba(255,215,0,0.4); }
.review-date { font-size: 15px; font-weight: 700; }
.review-summary { font-size: 12px; color: var(--sub); margin-top: 3px; }
.review-meta { text-align: right; }
.index-pills { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.index-pill { font-size: 11px; padding: 2px 8px; border-radius: 20px; background: var(--bg3); }
.bottom-section { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 32px; }
</style>
</head>
<body>
<div id="nav-container"></div>

<div class="container">
  <!-- Hero -->
  <div class="hero" style="text-align:left; padding: 32px 0 24px">
    <h1 class="page-title" style="font-size:32px">A股策略复盘平台</h1>
    <p class="page-sub">整合每日市场复盘 & 多维度选股策略，数据共享，自动更新</p>
    <div id="update-status"></div>
  </div>

  <!-- 快速入口 -->
  <div class="quick-cards">
    <div class="quick-card" onclick="location.href='/review.html'">
      <div class="icon">📊</div>
      <h3>每日复盘</h3>
      <div class="stat" id="review-count">-</div>
      <p>历史复盘记录</p>
    </div>
    <div class="quick-card" onclick="location.href='/strategy.html'">
      <div class="icon">🎯</div>
      <h3>选股策略</h3>
      <div class="stat" id="strategy-count">-</div>
      <p>命中策略股票</p>
    </div>
    <div class="quick-card" onclick="location.href='/selection.html'">
      <div class="icon">📋</div>
      <h3>选股列表</h3>
      <div class="stat" id="selection-count">-</div>
      <p>上传并匹配策略</p>
    </div>
  </div>

  <div class="bottom-section">
    <!-- 最新复盘 -->
    <div>
      <div class="section-title">📅 最近复盘
        <a href="/review.html" style="font-size:12px; color:var(--sub); font-weight:400; margin-left:auto">查看全部 →</a>
      </div>
      <div class="review-list" id="recent-reviews">
        <div class="loading"><div class="spinner"></div>加载中...</div>
      </div>
    </div>

    <!-- 策略统计 -->
    <div>
      <div class="section-title">🏆 策略命中统计</div>
      <div id="strategy-stats">
        <div class="loading"><div class="spinner"></div>加载中...</div>
      </div>

      <div class="section-title" style="margin-top:24px">🔥 三合一股票
        <a href="/strategy.html?tab=all3" style="font-size:12px; color:var(--sub); font-weight:400; margin-left:auto">查看全部 →</a>
      </div>
      <div id="sample-all3">
        <div class="loading"><div class="spinner"></div>加载中...</div>
      </div>
    </div>
  </div>
</div>

<script src="/assets/js/api.js"></script>
<script src="/assets/js/components.js"></script>
<script>
// 渲染导航
document.getElementById('nav-container').innerHTML = renderNav('index');
initNavStatus();

// 加载首页数据
async function loadHomepage() {
  try {
    const [status, reviews, strategy] = await Promise.all([
      api.getStatus(),
      api.getReviewList(1, 7),
      api.getStrategySummary(),
    ]);

    // 更新状态徽章
    const review = status.latest_review;
    if (review) {
      const statusMap = {
        published: ['badge-ok',      '✅ 数据更新完成'],
        partial:   ['badge-partial', '⚠️ 部分数据更新'],
        draft:     ['badge-draft',   '⏳ 数据还未更新'],
        failed:    ['badge-failed',  '❌ 数据获取失败'],
      };
      const [cls, msg] = statusMap[review.status] || statusMap.draft;
      document.getElementById('update-status').innerHTML =
        `<span class="badge ${cls}">${msg}
          <span style="color:var(--sub);font-weight:400;margin-left:4px">${formatDateDisplay(review.date)}</span>
        </span>`;
    }

    // 统计数字
    document.getElementById('review-count').textContent = reviews.total || 0;
    document.getElementById('strategy-count').textContent = status.strategy_stats?.any_hit || 0;

    // 最近复盘列表
    const reviewsEl = document.getElementById('recent-reviews');
    if (!reviews.items?.length) {
      reviewsEl.innerHTML = emptyHtml('暂无复盘数据', '首次更新将在今日 18:00 自动执行');
    } else {
      reviewsEl.innerHTML = reviews.items.map(r => `
        <div class="review-item" onclick="location.href='/review.html?date=${r.date}'">
          <div>
            <div class="review-date">${formatDateDisplay(r.date)}</div>
            <div class="review-summary">${r.summary || '点击查看详情'}</div>
          </div>
          <div class="review-meta">
            ${renderStatusBadge(r.status)}
          </div>
        </div>`).join('');
    }

    // 策略统计
    const stats = strategy.counts || {};
    document.getElementById('strategy-stats').innerHTML = `
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        ${[
          ['持股增长', stats.s1_count || 0, 'blue'],
          ['盈利质量', stats.s2_count || 0, 'green'],
          ['全速前进', stats.s3_count || 0, 'red'],
          ['三合一',  stats.all3_count || 0, 'gold'],
        ].map(([name, cnt, color]) => `
          <div class="card-sm" style="text-align:center">
            <div style="font-size:11px;color:var(--sub)">${name}</div>
            <div style="font-size:24px;font-weight:800;color:var(--${color})">${cnt}</div>
            <div style="font-size:11px;color:var(--sub)">只股票</div>
          </div>`).join('')}
      </div>
      <div style="font-size:11px;color:var(--sub);margin-top:8px;text-align:right">
        数据版本：${stats.data_version || '-'}
      </div>`;

    // 三合一样本
    const all3El = document.getElementById('sample-all3');
    if (!strategy.sample_all3?.length) {
      all3El.innerHTML = emptyHtml('暂无三合一股票');
    } else {
      all3El.innerHTML = `<div class="table-wrapper"><table>
        <thead><tr><th>代码</th><th>名称</th><th>行业</th></tr></thead>
        <tbody>${strategy.sample_all3.map(s => `
          <tr class="tr-hit" onclick="goToStock('${s.code}')" style="cursor:pointer">
            <td class="stock-code">${s.code}</td>
            <td class="stock-name">${s.name}</td>
            <td style="color:var(--sub);font-size:12px">${s.industry || '-'}</td>
          </tr>`).join('')}
        </tbody></table></div>`;
    }

    // 选股列表数量
    const selResp = await api.getSelectionList(1, 1);
    document.getElementById('selection-count').textContent = selResp.total || 0;

  } catch (e) {
    console.error('Homepage load error:', e);
    showToast('数据加载失败：' + e.message, 'err');
  }
}

function renderStatusBadge(status) {
  const map = {
    published: ['badge-ok',      '已更新'],
    partial:   ['badge-partial', '部分更新'],
    draft:     ['badge-draft',   '未更新'],
    failed:    ['badge-failed',  '失败'],
  };
  const [cls, label] = map[status] || map.draft;
  return `<span class="badge ${cls}">${label}</span>`;
}

loadHomepage();
</script>
</body>
</html>
